name: ERP Sync — Stock

on:
  schedule:
    # Cada hora, en punto — mismo patrón que erp-sync-clientes-deudores.yml,
    # cuyo `schedule` nativo de GitHub sí corre confiable en este repo.
    - cron: '0 * * * *'
  workflow_dispatch:   # permite dispararlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        working-directory: scripts/erp-sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar sync (login → descarga Stock → upload a la PWA)
        working-directory: scripts/erp-sync
        env:
          HEADLESS: '1'
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          UPLOAD_URL_BASE: ${{ secrets.UPLOAD_URL_BASE }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET_STOCK }}
        run: python extractor_stock.py

      - name: Guardar Excel descargado (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-xlsx
          path: scripts/erp-sync/downloads/*.xlsx
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar capturas si algo falla (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erp-sync-stock-debug
          path: scripts/erp-sync/*.png
          if-no-files-found: ignore
          retention-days: 5
