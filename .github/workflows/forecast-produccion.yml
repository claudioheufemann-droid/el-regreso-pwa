name: Forecast de Producción (Prophet)

on:
  schedule:
    # Día 2 de cada mes, 08:00 UTC (~05:00 Chile invierno). Mensual porque el
    # forecast agrega ventas por mes calendario — corre cada 15 min no aporta
    # nada nuevo hasta que cierra el mes. Día 2 (no el 1) le da margen al sync
    # de ventas para terminar de cargar el último día del mes anterior.
    - cron: '0 8 2 * *'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Prophet compila un modelo Stan la primera vez que corre — más lento que el resto de los sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/forecast/requirements.txt

      - name: Instalar dependencias
        working-directory: scripts/forecast
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar y subir el forecast
        working-directory: scripts/forecast
        env:
          UPLOAD_URL_BASE: ${{ secrets.UPLOAD_URL_BASE }}
          UPLOAD_SECRET_FORECAST: ${{ secrets.UPLOAD_SECRET_FORECAST }}
        run: python generar_forecast.py
