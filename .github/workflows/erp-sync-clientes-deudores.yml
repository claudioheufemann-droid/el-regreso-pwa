name: ERP Sync — Clientes y Deudores

on:
  schedule:
    # 2 veces al día (10:00 y 18:00 UTC ≈ 06:00 y 14:00 Chile). A diferencia de
    # ventas, clientes/deudores no cambian minuto a minuto — no hace falta cada
    # 15 min. El schedule nativo de GitHub no es confiable en este repo (ver
    # memoria del proyecto); el disparo real viene de cron-job.org llamando a
    # workflow_dispatch, igual que erp-sync-ventas.yml. Este queda de respaldo.
    - cron: '0 10,18 * * *'
  workflow_dispatch:   # permite dispararlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        working-directory: scripts/erp-sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar sync (login → descarga Clientes+Deudores → upload a la PWA)
        working-directory: scripts/erp-sync
        env:
          HEADLESS: '1'
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          UPLOAD_URL_BASE: ${{ secrets.UPLOAD_URL_BASE }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET_CLIENTES }}
        run: python extractor_clientes_deudores.py

      - name: Guardar Excels descargados (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientes-deudores-xlsx
          path: scripts/erp-sync/downloads/*.xlsx
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar capturas si algo falla (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erp-sync-clientes-deudores-debug
          path: scripts/erp-sync/*.png
          if-no-files-found: ignore
          retention-days: 5
