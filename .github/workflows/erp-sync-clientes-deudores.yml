name: ERP Sync — Clientes y Deudores

on:
  schedule:
    # Cada hora, en punto. A diferencia de erp-sync-ventas.yml, este SÍ corre
    # confiable con el `schedule` nativo de GitHub (verificado: corridas
    # exitosas cada 12h desde el 28-ago-2026 con el cron anterior de 2x/día,
    # sin necesitar el disparador externo de cron-job.org). Subido a cada
    # hora el 31-ago-2026 a pedido — clientes/deudores no cambian tan rápido
    # como ventas, pero así el aviso de "cliente nuevo" llega casi en vivo.
    - cron: '0 * * * *'
  workflow_dispatch:   # permite dispararlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        working-directory: scripts/erp-sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar sync (login → descarga Clientes+Deudores → upload a la PWA)
        working-directory: scripts/erp-sync
        env:
          HEADLESS: '1'
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          UPLOAD_URL_BASE: ${{ secrets.UPLOAD_URL_BASE }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET_CLIENTES }}
        run: python extractor_clientes_deudores.py

      - name: Guardar Excels descargados (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientes-deudores-xlsx
          path: scripts/erp-sync/downloads/*.xlsx
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar capturas si algo falla (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erp-sync-clientes-deudores-debug
          path: scripts/erp-sync/*.png
          if-no-files-found: ignore
          retention-days: 5
