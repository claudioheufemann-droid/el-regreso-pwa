name: ERP Sync — Carga automática de ventas

on:
  schedule:
    # Diario 11:00 UTC (~07:00–08:00 Chile). Corre ANTES de las misiones (12:00 UTC)
    # para que la generación use datos frescos del día.
    - cron: '0 11 * * *'
  workflow_dispatch:   # permite dispararlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        working-directory: scripts/erp-sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar sync (login → descarga → upload a la PWA)
        working-directory: scripts/erp-sync
        env:
          HEADLESS: '1'
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.CRON_SECRET }}
        run: python extractor.py

      - name: Guardar capturas si algo falla (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erp-sync-debug
          path: scripts/erp-sync/*.png
          if-no-files-found: ignore
          retention-days: 5
